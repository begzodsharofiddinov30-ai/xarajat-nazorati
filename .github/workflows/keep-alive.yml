# Render'ning bepul tarifida sayt 15 daqiqa so'rov bo'lmasa uxlaydi.
# Bu workflow har 5 daqiqada /api/health ga so'rov yuborib, saytni uyg'oq ushlab turadi.
# GitHub jadvalli ishga tushirishni ba'zan bir necha daqiqa kechiktiradi, shuning uchun interval 15 daqiqadan ancha qisqa.
name: Keep alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 90 --retry 3 --retry-delay 10 https://xarajat-nazorati.onrender.com/api/health
